name: Build Retail Hell Android app

on:
  push:
    branches: [android-app]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build release bundle and test APK
        run: gradle --no-daemon :app:bundleRelease :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: outputs
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/debug/app-debug.apk

  test-on-emulator:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: outputs
          path: out

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the app on an Android phone emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            mkdir -p shots
            adb install -r out/apk/debug/app-debug.apk
            adb shell am start -W -n com.moneyisjesus.registerrage/.MainActivity
            sleep 25
            adb exec-out screencap -p > shots/1-start-screen.png
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" > shots/resumed-activity.txt || true
            adb shell input tap 540 1700
            sleep 6
            adb exec-out screencap -p > shots/2-tap.png
            adb shell dumpsys window | grep -E "mCurrentFocus|mFocusedApp" > shots/focused-window.txt || true
            adb logcat -d -s chromium:I > shots/web-console.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-shots
          path: shots

  publish-outputs:
    needs: [build, test-on-emulator]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Push outputs to the android-out branch
        run: |
          mkdir pub && cd pub
          git init -q
          git checkout -q -b android-out
          cp ../dl/outputs/bundle/release/app-release.aab . || true
          cp ../dl/outputs/apk/debug/app-debug.apk . || true
          mkdir -p shots && cp -r ../dl/emulator-shots/. shots/ 2>/dev/null || true
          echo "run ${GITHUB_RUN_ID} sha ${GITHUB_SHA}" > BUILD.txt
          git add -A
          git -c user.name=github-actions -c user.email=actions@users.noreply.github.com commit -q -m "Build outputs for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" android-out
