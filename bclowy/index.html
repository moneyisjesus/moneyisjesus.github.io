<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c62828">
<meta name="description" content="B.C.LOWY 喜劇作品集散地 — 最新文章、分類、搜尋和收藏。">
<title>B.C.LOWY</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="masthead">
    <div class="brand"><span class="logo">B.C</span><span class="brand-name">LOWY<small>喜劇作品集散地</small></span></div>
    <button id="refresh" class="icon-btn" aria-label="重新整理">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.75 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
    </button>
  </div>
  <nav id="sections" class="sections" aria-label="分類"></nav>
</header>

<main>
  <section id="view-home" class="view active" aria-label="首頁"><div id="feed"><div class="loading">載入中…</div></div></section>
  <section id="view-cats" class="view" aria-label="分類"><h1 class="page-title">分類</h1><div id="cats" class="cats"></div></section>
  <section id="view-search" class="view" aria-label="搜尋">
    <form id="search-form" class="search" autocomplete="off"><input id="q" type="search" placeholder="搜尋文章" aria-label="搜尋文章"></form>
    <div id="results"></div>
  </section>
  <section id="view-saved" class="view" aria-label="收藏"><h1 class="page-title">我的收藏</h1><div id="saved"></div></section>
  <footer class="foot">內容來自 <a href="https://bclowychinese.blogspot.com/" target="_blank" rel="noopener">B.C.LOWYCHINESE</a> · <a href="privacy.html">隱私政策</a></footer>
</main>

<article id="reader" class="reader" hidden aria-label="文章">
  <div class="reader-bar">
    <button id="close" class="icon-btn plain" aria-label="返回">‹</button>
    <div class="reader-tools">
      <button id="font-down" class="icon-btn plain" aria-label="縮小字體">A−</button>
      <button id="font-up" class="icon-btn plain" aria-label="放大字體">A+</button>
      <button id="save" class="icon-btn plain" aria-label="收藏">☆</button>
      <button id="share" class="icon-btn plain" aria-label="分享">⤴</button>
    </div>
  </div>
  <div id="reader-body" class="reader-body"></div>
</article>

<nav class="tabs" aria-label="主選單">
  <button data-view="home" class="active"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 4h16v4H4zm0 6h7v10H4zm9 0h7v4h-7zm0 6h7v4h-7z"/></svg>首頁</button>
  <button data-view="cats"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 4h7v7H4zm9 0h7v7h-7zM4 13h7v7H4zm9 0h7v7h-7z"/></svg>分類</button>
  <button data-view="search"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M10 2a8 8 0 0 1 6.32 12.9l5.39 5.4-1.41 1.4-5.4-5.39A8 8 0 1 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg>搜尋</button>
  <button data-view="saved"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6 2h12a1 1 0 0 1 1 1v19l-7-4-7 4V3a1 1 0 0 1 1-1z"/></svg>收藏</button>
</nav>
<div id="toast" class="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
